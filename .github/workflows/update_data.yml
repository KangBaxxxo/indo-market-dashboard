name: Update Market Data

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # 09:30 UTC = 16:30 WIB, Senin-Jumat
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update stock market data
        run: |
          python -u update_data.py

      - name: Check market database
        run: |
          python - <<'PY'
          import sqlite3
          import pandas as pd

          print("=== MARKET DB SNAPSHOT ===")

          con = sqlite3.connect("data/market.db")
          snap = pd.read_sql("""
              SELECT ticker, MAX(trade_date) AS latest_date
              FROM daily_prices
              GROUP BY ticker
              ORDER BY ticker
              LIMIT 50
          """, con)
          con.close()

          print(snap.to_string(index=False))
          PY

      - name: Commit market database only
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/market.db || true

          if git diff --cached --quiet; then
            echo "No market database changes to commit."
          else
            git commit -m "daily stock market data update"
            git push
          fi
