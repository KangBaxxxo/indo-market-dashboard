name: Daily Update and Gold Signal Notify

on:
  schedule:
    # 00:15 UTC = 07:15 WIB
    - cron: "15 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_daily_pipeline.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/market.db || true
          git add data/driver_prices.csv || true
          git add data/driver_scores.csv || true
          git add data/gold_signal_state.json || true

          git add gold_beneficiaries_summary.csv || true
          git add gold_beneficiaries_year_by_year.csv || true
          git add gold_beneficiaries_trade_detail.csv || true
          git add gold_beneficiaries_year_by_year.xlsx || true

          git add gold_threshold_sensitivity_summary.csv || true
          git add gold_threshold_sensitivity_best.csv || true
          git add gold_usdidr_overlay_summary.csv || true
          git add gold_basket_backtest_summary.csv || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "daily market data update and gold signal check"
            git push
          fi