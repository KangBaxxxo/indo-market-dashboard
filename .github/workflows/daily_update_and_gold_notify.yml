name: Daily Update and Gold Signal Notify

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    # 10:00 UTC = 17:00 WIB, Senin-Jumat
    # Dibuat setelah Update Market Data supaya market.db sudah fresh dulu.
    - cron: "0 10 * * 1-5"

permissions:
  contents: write

jobs:
  driver-and-signal-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Show current commit
        run: |
          echo "=== CURRENT COMMIT ==="
          git rev-parse HEAD

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Merge latest coal raw
        run: |
          python -u merge_latest_coal_raw.py

      - name: Update driver prices
        run: |
          python -u update_drivers.py

      - name: Build gold backtest processed files
        run: |
          python -u build_gold_processed_backtest.py

      - name: Build latest driver signals
        run: |
          python -u latest_driver_signals.py
          python -u build_nickel_latest_signal.py

      - name: Build gold HRTA confidence signal
        run: |
          python -u build_gold_hrta_confidence_signal.py
          python -u notify_driver_signals.py

      - name: Check driver and signal data
        run: |
          python - <<'PY'
          import pandas as pd

          print("=== DRIVER PRICES ===")
          driver = pd.read_csv("data/driver_prices.csv")
          driver["driver_date"] = pd.to_datetime(
              driver["driver_date"],
              format="mixed",
              errors="coerce"
          )

          print(
              driver.groupby("driver").agg(
                  rows=("value", "count"),
                  latest_date=("driver_date", "max"),
                  latest_value=("value", "last"),
              ).to_string()
          )

          print("")
          print("=== DRIVER SCORES ===")
          scores = pd.read_csv("data/driver_scores.csv")
          print(scores.to_string(index=False))

          print("")
          print("=== LATEST DRIVER SIGNALS ===")
          signals = pd.read_csv("data/processed/latest_driver_signals.csv")

          show_cols = [
              "driver_group",
              "driver_symbol",
              "driver_latest_date",
              "driver_return_pct",
              "signal_status",
              "last_signal_date",
              "target_ticker",
              "stock_latest_date",
          ]

          show_cols = [c for c in show_cols if c in signals.columns]
          print(signals[show_cols].to_string(index=False))
          PY

      - name: Commit driver and signal data only
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/raw/newcastle_coal.csv || true
          git add data/raw/newcastle_coal_latest.csv || true
          git add data/driver_prices.csv || true
          git add data/driver_scores.csv || true
          git add data/processed/latest_driver_signals.csv || true
          git add data/gold_signal_state.json || true
          git add data/driver_signal_notify_state.json || true
          git add data/processed/gold_backtest_summary.csv || true
          git add data/processed/gold_trade_details.csv || true
          git add data/processed/gold_year_by_year.csv || true
          git add data/processed/gold_hrta_confidence_signal.csv || true

          if git diff --cached --quiet; then
            echo "No driver or signal changes to commit."
          else
            git commit -m "daily driver and signal update"
            git push
          fi
