name: Daily Update and Gold Signal Notify

on:
  schedule:
    # 00:15 UTC = 07:15 WIB
    - cron: "15 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      run: |
        echo "=== CURRENT COMMIT ==="
        git rev-parse HEAD

        echo "=== CHECK run_daily_pipeline.py CONTENT ==="
        grep -n "DATABASE CHECK" run_daily_pipeline.py || true
        grep -n "check_database" run_daily_pipeline.py || true

        echo "=== CHECK DATABASE BEFORE RUN ==="
        python - <<'EOF'
        import sqlite3
        from pathlib import Path

        db = Path("data/market.db")
        print("DB exists:", db.exists())
        print("DB size:", db.stat().st_size if db.exists() else "N/A")

        if db.exists():
            conn = sqlite3.connect(db)
            cur = conn.cursor()
            cur.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")
            print("Tables:", cur.fetchall())
            conn.close()
        EOF

        echo "=== RUN PIPELINE ==="
        python -u run_daily_pipeline.py
        
      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/market.db || true
          git add data/driver_prices.csv || true
          git add data/driver_scores.csv || true
          git add data/gold_signal_state.json || true

          git add gold_beneficiaries_summary.csv || true
          git add gold_beneficiaries_year_by_year.csv || true
          git add gold_beneficiaries_trade_detail.csv || true
          git add gold_beneficiaries_year_by_year.xlsx || true

          git add gold_threshold_sensitivity_summary.csv || true
          git add gold_threshold_sensitivity_best.csv || true
          git add gold_usdidr_overlay_summary.csv || true
          git add gold_basket_backtest_summary.csv || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "daily market data update and gold signal check"
            git push
          fi